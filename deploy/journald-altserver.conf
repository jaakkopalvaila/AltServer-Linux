# journald limits, so a runaway service can't fill the disk.
# Install: sudo mkdir -p /etc/systemd/journald.conf.d && sudo cp journald-altserver.conf /etc/systemd/journald.conf.d/altserver.conf
#          sudo systemctl restart systemd-journald
#
# On 2026-09-06 a pre-NG AltServer build busy-looped and wrote 68 GB of logs before the disk filled.
# altserver.service rate-limits itself too; these are the system-wide caps behind it.

[Journal]
SystemMaxUse=1G
RateLimitIntervalSec=30s
RateLimitBurst=1000
